networks:
  sistema-bancario:
      driver: bridge

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: sistemaBancario
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin.01
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sistema-bancario

  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zookeeper
    restart: always
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - sistema-bancario

  kafka:
    image: bitnami/kafka:3.9.0
    container_name: kafka
    restart: always
    environment:      
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    networks:
      - sistema-bancario

  cliente:
    build: ./cliente
    container_name: cliente
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - kafka
    networks:
      - sistema-bancario

  cuenta:
    build: ./cuenta
    container_name: cuenta
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka
    networks:
      - sistema-bancario

volumes:
  postgres-data:
